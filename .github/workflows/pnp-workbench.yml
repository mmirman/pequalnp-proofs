name: pnp workbench
on:
  push:
    branches: [pnp-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean/lean-toolchain)"
      - uses: actions/cache@v4
        with:
          path: |
            lean/.lake
          key: pnp-lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml') }}-stable
          restore-keys: |
            pnp-lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml') }}-
      - name: Fetch prebuilt Mathlib
        working-directory: lean
        run: lake exe cache get
      - name: Build project definitions
        working-directory: lean
        run: lake build PEqualNP.Defs
      - name: Check current proof experiments
        working-directory: lean
        run: |
          pnp_result=0
          lake build PEqualNP.Outside.L_meta_1044 || pnp_result=1
          lake env lean AssignmentAudit.lean || pnp_result=1
          if [ -f Workbench.lean ]; then
            cp Workbench.lean PEqualNP/Outside/L_meta_1019.lean
            lake build PEqualNP.Outside.L_meta_1019 || pnp_result=1
          fi
          # BoundedDegreeDiagonal.lean remains an unverified draft after its lease was invalidated.
          for pnp_file in OneNotWorkbench.lean OwnershipObstruction.lean CofactorWorkbench.lean PivotBarrier.lean PivotGuard.lean InterfaceWorkbench.lean SoundExtraction.lean TripleFamily.lean NetMaskIdentity.lean PetersenOrInterface.lean; do
            if [ -f "$pnp_file" ]; then
              lake env lean "$pnp_file" || pnp_result=1
            fi
          done
          exit "$pnp_result"
