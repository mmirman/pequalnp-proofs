name: pnp workbench
on:
  push:
    branches: [pnp-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthesis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install synthesis tool
        run: sudo apt-get update -qq && sudo apt-get install -y yosys-abc
      - name: Explore and independently verify mapped circuits
        run: python3 research/abc_search.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matching-candidates
          path: results/
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean/lean-toolchain)"
      - uses: actions/cache@v4
        with:
          path: |
            lean/.lake
          key: pnp-lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml') }}-stable
          restore-keys: |
            pnp-lean-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json', 'lean/lakefile.toml') }}-
      - name: Fetch prebuilt Mathlib
        working-directory: lean
        run: lake exe cache get
      - name: Build project definitions
        working-directory: lean
        run: lake build PEqualNP.Defs
      - name: Check current proof experiments
        working-directory: lean
        run: |
          if [ -f Workbench.lean ]; then
            cp Workbench.lean PEqualNP/Outside/L_meta_1019.lean
            lake build PEqualNP.Outside.L_meta_1019
          fi
          if [ -f MatchingUpper.lean ]; then
            lake env lean MatchingUpper.lean
          fi
